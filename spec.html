<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<title>仕様書（ダミー）｜灯野工業（制作例）</title>
<style>
  body{font-family:"Hiragino Sans","Yu Gothic UI","Yu Gothic","Noto Sans JP","Noto Sans CJK JP","Meiryo",system-ui,sans-serif;max-width:780px;margin:0 auto;padding:32px 24px 72px;line-height:1.8;color:#18191c;background:#fbfaf7}
  .banner{border:1px solid #8a5a12;border-left-width:4px;background:#f6ecd6;padding:10px 16px;font-weight:700;font-size:14px}
  .doc{font-size:12px;letter-spacing:.14em;color:#5e6168;margin:36px 0 0;padding-bottom:10px;border-bottom:2px solid #18191c}
  table{border-collapse:collapse;width:100%;margin:20px 0}th,td{border-bottom:1px solid #d9d4cb;padding:10px 12px 10px 0;text-align:left;vertical-align:top}th{color:#5e6168;font-weight:500;width:9em;font-size:14px}
  h1{font-family:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Noto Serif CJK JP",serif;font-weight:600;font-size:28px;letter-spacing:.06em;margin:16px 0 0}
  .sku{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:600;color:#5e6168;margin:0}
  .foot{font-size:12.5px;color:#5e6168}
  a{color:#18191c}:focus-visible{outline:3px solid #1d4ed8;outline-offset:3px}
  button{font:inherit;font-weight:600;border:1px solid #18191c;background:transparent;padding:8px 16px;cursor:pointer;margin-left:12px}
  @media print{.noprint{display:none}body{background:#fff}}
</style>
</head>
<body>
<p class="banner">これは制作例のためのダミー仕様書（HTML）です。PDFではなく、会社・製品はすべて架空です。</p>
<div id="spec">読み込み中…</div>
<p class="noprint"><a href="products.html">製品一覧へ戻る</a>　<button type="button" onclick="window.print()">印刷する</button></p>
<script type="module">
  import { loadProducts, cctText, wattText, lumenText, priceMark } from './js/common.js';
  const id = new URLSearchParams(location.search).get('id') || '';
  const el = document.getElementById('spec');
  try {
    const p = (await loadProducts()).find((x) => x.id === id);
    if (!p) { el.textContent = '該当する製品がありません。'; }
    else {
      document.title = `仕様書（ダミー）${p.id}｜灯野工業（制作例）`;
      const rows = [['品番', p.id], ['形状', p.type], ['用途', p.use.join('・')], ['設置環境', p.env.join('・')], ['色温度', cctText(p)], ['消費電力', wattText(p)], ['光束', lumenText(p)], ['IP等級', 'IP' + p.ip], ['価格帯の目安', priceMark(p) + ' ' + p.priceText]];
      const mkp = (cls, txt) => { const e = document.createElement('p'); if (cls) e.className = cls; e.textContent = txt; return e; };
      const h1 = document.createElement('h1'); h1.textContent = p.name;
      const table = document.createElement('table');
      rows.forEach(([k, v]) => { const tr = table.insertRow(); const th = document.createElement('th'); th.scope = 'row'; th.textContent = k; tr.appendChild(th); tr.insertCell().textContent = v; });
      el.replaceChildren(mkp('doc', '灯野工業（架空）　製品仕様書　見本'), h1, mkp('sku', p.id), mkp('', p.desc), table, mkp('foot', '発行：（ダミー）／ 改訂：なし／ この資料に記載の数値は実在のものではありません。'));
    }
  } catch (e) { el.textContent = 'データを読み込めませんでした。'; }
</script>
</body>
</html>
